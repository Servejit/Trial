name: Build Punjabi motivational video

on:
  workflow_dispatch:
  push:
    paths:
      - "scenes/**"
      - "captions/**"
      - "scripts/render_video.sh"
      - ".github/workflows/build-video.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools and Punjabi font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Render 30-second video
        run: bash scripts/render_video.sh
      - name: Commit rendered MP4 to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/rukna-nahi-30s.mp4
          if git diff --cached --quiet; then
            echo "Video is already up to date."
          else
            git commit -m "Add rendered 30-second Punjabi motivational video"
            git pull --rebase origin main
            git push
          fi
